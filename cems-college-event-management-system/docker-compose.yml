services:
  cems-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cems-backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=cems_super_secret_jwt_key_2026_secure
      - CLIENT_URL=http://localhost:8080

  cems-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cems-frontend
    ports:
      - "8080:80"
    depends_on:
      - cems-backend
